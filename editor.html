<!doctype html>
<html lang="uk">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Редакція · 86 News</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{color-scheme:dark;--page:#181b1b;--surface:#212525;--line:#424848;--ink:#f1efe6;--muted:#b6bdb6;--accent:#b5e0b1}
*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,sans-serif}
main{max-width:1320px;margin:auto;padding:24px clamp(16px,4vw,56px) max(48px,env(safe-area-inset-bottom))}
header,.row,nav{display:flex;align-items:center;justify-content:space-between;gap:12px}
header{border-bottom:3px double var(--muted);padding:0 0 16px}.brand,h1,h2{font-family:Georgia,"Times New Roman",serif;font-weight:400}.brand{font-size:clamp(36px,6vw,64px);line-height:1;letter-spacing:-2px}.brand b{color:var(--accent);font-weight:500}header small{text-align:right}
nav{justify-content:flex-start;gap:4px;border-bottom:1px solid var(--line);padding:8px 0}button,.attach{min-height:44px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);padding:8px 16px;font:inherit;cursor:pointer;transition:background-color .16s,border-color .16s}
nav button{flex:1;padding:8px 4px;color:var(--muted);border:0;border-radius:4px;background:transparent}nav button[aria-current=true]{color:var(--accent);background:#29312b}
button:hover,.attach:hover{border-color:var(--muted)}nav button:hover{background:var(--surface)}button:disabled{opacity:.52;cursor:default}
h1{font-size:clamp(32px,5vw,52px);line-height:1.08;letter-spacing:-1px;margin:24px 0}h2{font-size:28px;line-height:1.2;margin:32px 0 16px}h3{font-size:18px;font-weight:500;margin:4px 0 12px}
label{display:block;font-weight:500}small,.meta{color:var(--muted);font-variant-numeric:tabular-nums;font-size:14px}
textarea,input:not([type=file]),select{display:block;margin:8px 0 16px;width:100%;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:inherit;padding:12px;font:inherit}
textarea{resize:vertical;min-height:104px}#body{min-height:180px}textarea::placeholder,input::placeholder{color:#a4aaa5}
fieldset{border:0;margin:0;padding:0;min-width:0}.photo{margin:16px 0 4px}.attach{position:relative;display:inline-flex;align-items:center;overflow:hidden}.attach input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.primary{width:100%;margin-top:20px;background:var(--accent);color:#152318;border-color:transparent;font-weight:600}.primary:hover{background:#cbebc7}
:focus-visible,.attach:focus-within{outline:2px solid var(--accent);outline-offset:3px}
figure{margin:16px 0}img{max-width:100%;max-height:320px;border-radius:8px;display:block}p.copy,.casebody{white-space:pre-wrap;overflow-wrap:anywhere}
#preview,.item{padding:16px 0;border-top:1px solid var(--line)}#preview strong{font:24px Georgia,serif}#status,.notice{color:var(--accent);margin:12px 0}.notice:empty{display:none}
meter{width:100%;height:12px;accent-color:var(--accent)}meter::-webkit-meter-optimum-value{background:var(--accent)}meter::-webkit-meter-bar{background:#333938;border:0}
details{border-top:1px solid var(--line);padding:12px 0}summary{cursor:pointer;overflow-wrap:anywhere}.item,.workarea{min-width:0;overflow-wrap:anywhere}
[hidden]{display:none!important}@media(min-width:800px){.desk{display:grid;grid-template-columns:220px minmax(0,1fr);gap:48px}nav{display:flex;flex-direction:column;align-self:start;align-items:stretch;border:0;padding-top:32px}nav button{text-align:left;padding:12px 16px}.workarea{padding:8px 0 24px 32px;border-left:1px solid var(--line);max-width:920px}.pollgrid{display:grid;grid-template-columns:1fr 1fr;gap:32px}.pollgrid h2{margin-top:0}}
</style>
<main>
<header><span class="brand"><b>86</b> News</span><small>Редакція ліцею<br><time id="date"></time></small></header>
<div class="desk"><nav aria-label="Розділи редакції"><button data-view="postview" aria-current="true">Публікації</button><button data-view="pollview" disabled>Опитування</button><button data-view="caseview" disabled>Звернення</button></nav>
<div class="workarea"><section id="postview">
<h1 id="title">Нова публікація</h1>
<fieldset id="composer" disabled>
<div class="row"><label for="body">Текст новини</label><small id="count">0 / 4000</small></div>
<textarea id="body" placeholder="Що відбувається у школі?"></textarea>
<div class="row photo"><label class="attach"><span id="fileLabel">Додати фото</span><input id="file" type="file" accept="image/jpeg,image/png,image/webp" aria-label="Обрати фото"></label><button id="remove" type="button" hidden>Прибрати</button></div>
<figure id="thumbWrap" hidden><img id="thumb" alt="Обране фото"></figure>
<small>JPG, PNG або WebP · до 8 МБ</small>
<button class="primary" id="review" disabled>Переглянути допис</button>
</fieldset>
<section id="confirmation" hidden><article id="preview"><strong>86 News</strong><figure id="previewWrap" hidden><img id="previewImg" alt="Фото до публікації"></figure><p id="previewText" class="copy"></p></article>
<button id="edit">До редагування</button><button id="publish" class="primary">Опублікувати для підписників</button></section>
<p id="status" role="status" aria-live="polite">Перевіряємо доступ…</p>
<button id="next" hidden>Створити ще одну новину</button>
</section>
<section id="pollview" hidden><h1>Опитування</h1><div class="pollgrid">
<form id="pollform"><label>Запитання<input name="question" maxlength="300" required placeholder="Що запитаємо в учнів?"></label>
<label>Варіанти відповіді<textarea id="choices" required placeholder="Кожен варіант з нового рядка"></textarea></label><small>Від 2 до 10 варіантів</small>
<button class="primary">Опублікувати опитування</button><p id="pollmsg" role="status" class="notice"></p></form>
<div><h2>Результати</h2><button data-refresh="polls">Оновити</button><div id="pollsList"></div><button id="pollsMore" hidden>Показати ще</button></div></div></section>
<section id="caseview" hidden><h1>Звернення</h1><button data-refresh="cases">Оновити список</button><div id="casesList"></div><button id="casesMore" hidden>Показати ще</button></section>
</div></div>
</main>
<script>
const el = id => document.getElementById(id);
const app = window.Telegram?.WebApp;
const headers = {'X-Telegram-Init-Data': app?.initData || ''};
let nonce, url;
app?.ready(); app?.expand();
function update() {
  const size = el('body').value.trim().length;
  const limit = el('file').files.length ? 1000 : 4000;
  el('count').textContent = size + ' / ' + limit;
  el('review').disabled = !size || size > limit;
  nonce = crypto.randomUUID();
}
function picture() {
  const file = el('file').files[0];
  if (url) URL.revokeObjectURL(url);
  if (file && file.size > 8 * 1024 * 1024) {
    el('status').textContent = 'Оберіть файл до 8 МБ.';
    el('file').value = '';
  } else el('status').textContent = '';
  const selected = el('file').files[0];
  url = selected ? URL.createObjectURL(selected) : '';
  el('thumbWrap').hidden = el('remove').hidden = !url;
  el('fileLabel').textContent = url ? 'Замінити фото' : 'Додати фото';
  if (url) el('thumb').src = url;
  update();
}
el('body').oninput = update;
el('file').onchange = picture;
el('remove').onclick = () => { el('file').value = ''; picture(); };
function showPreview(show) {
  el('composer').hidden = show;
  el('confirmation').hidden = !show;
  el('title').textContent = show ? 'Попередній перегляд' : 'Нова публікація';
  el('status').textContent = '';
  window.scrollTo(0,0);
}
el('review').onclick = () => {
  el('previewText').textContent = el('body').value.trim();
  el('previewWrap').hidden = !url;
  if (url) el('previewImg').src = url;
  showPreview(true);
};
el('edit').onclick = () => showPreview(false);
async function call(options = {}, path = '/api/editor') {
  const r = await fetch(path, {headers, ...options});
  if (!r.ok) {
    const data = await r.json().catch(() => ({}));
    throw Error(data.error || 'Не вдалося виконати запит. Спробуйте ще раз.');
  }
  return r.json();
}
el('publish').onclick = async () => {
  const data = new FormData();
  data.set('text', el('body').value.trim());
  data.set('nonce', nonce);
  if (el('file').files.length) data.set('photo', el('file').files[0]);
  el('publish').disabled = el('edit').disabled = true;
  el('status').textContent = 'Публікуємо…';
  try {
    await call({method:'POST', body:data});
    el('confirmation').hidden = true;
    el('title').textContent = 'Опубліковано';
    el('status').textContent = 'Новина у стрічці. Розсилку підписникам додано до черги.';
    el('next').hidden = false;
  } catch (err) {el('status').textContent = err.message;}
  finally {el('publish').disabled = el('edit').disabled = false;}
};
el('next').onclick = () => {
  el('body').value = el('file').value = '';
  picture(); el('next').hidden = true; showPreview(false); el('body').focus();
};
call().then(() => {document.querySelectorAll('nav button').forEach(b=>b.disabled=false); el('composer').disabled = false; el('status').textContent = ''; update();})
.catch(err => {el('status').textContent = err.message;});
el('date').textContent = new Intl.DateTimeFormat('uk-UA',{day:'numeric',month:'long',timeZone:'Europe/Kyiv'}).format(new Date());
const tabs = Array.from(document.querySelectorAll('nav button'));
for (const tab of tabs) tab.onclick = () => {
  for (const other of tabs) {
    const active = other === tab;
    el(other.dataset.view).hidden = !active;
    other.setAttribute('aria-current',String(active));
  }
  if (tab.dataset.view !== 'postview') loadList(tab.dataset.view === 'pollview' ? 'polls' : 'cases');
};
function node(name, text, parent, klass) {
  const child = document.createElement(name);
  if (text !== undefined) child.textContent = text;
  if (klass) child.className = klass;
  parent.append(child);
  return child;
}
function renderPoll(item, parent) {
  const article = node('article',undefined,parent,'item');
  const total = Object.values(item.counts).reduce((a,b)=>a+b,0);
  node('h3',item.question,article);
  node('small','Усього голосів — '+total,article);
  item.options.forEach((label,i)=>{
    const count = item.counts[i] || 0;
    const row = node('div',undefined,article,'row');
    node('span',label,row); node('span',String(count),row,'meta');
    const bar = node('meter',undefined,article);
    bar.max = total || 1; bar.value = count; bar.setAttribute('aria-label',label);
  });
}
function renderCase(item, parent) {
  const card = node('details',undefined,parent);
  const summary = node('summary','№ '+item.id+' · '+item.body.split('\n')[0]+' — '+item.state,card);
  node('p',item.body,card,'casebody');
  const form = node('form',undefined,card);
  const select = node('select',undefined,node('label','Статус',form));
  for (const state of ['Отримано','Розглядаємо','Є відповідь']) node('option',state,select);
  select.value=item.state;
  const answer = node('textarea',undefined,node('label','Відповідь учневі',form));
  answer.value=item.answer; answer.maxLength=2000;
  const save=node('button','Зберегти',form,'primary');
  const notice=node('p','',form,'notice'); notice.setAttribute('role','status');
  form.onsubmit=async ev=>{
    ev.preventDefault(); save.disabled=true;
    const data=new FormData();
    data.set('id',item.id); data.set('version',item.version);
    data.set('state',select.value); data.set('answer',answer.value.trim());
    try {
      await call({method:'POST',body:data},'/api/cases');
      item.version++; summary.textContent='№ '+item.id+' · '+item.body.split('\n')[0]+' — '+data.get('state');
      notice.textContent='Зміни збережено';
    } catch(e){notice.textContent=e.message;}
    finally{save.disabled=false;}
  };
}
const pages={};
async function loadList(kind, before) {
  const list=el(kind+'List'), more=el(kind+'More');
  const generation=Symbol();
  pages[kind]=generation;
  more.hidden=true;
  if (!before) list.textContent='Завантаження…';
  try {
    const result=await call({},'/api/'+kind+(before?'?before='+before:''));
    if (pages[kind]!==generation) return;
    if (!before) list.replaceChildren();
    const draw=kind==='polls'?renderPoll:renderCase;
    result.items.forEach(item=>draw(item,list));
    if (!before && !result.items.length) node('p',kind==='polls'?'Опитувань поки немає':'Звернень поки немає',list,'meta');
    if (result.items.length===20) {more.hidden=false;more.onclick=()=>loadList(kind,result.items.at(-1).id);}
  } catch(e){if(pages[kind]===generation) list.textContent=e.message;}
}
document.querySelectorAll('[data-refresh]').forEach(b=>b.onclick=()=>loadList(b.dataset.refresh));
let pollNonce=crypto.randomUUID();
el('pollform').oninput=()=>{pollNonce=crypto.randomUUID();};
el('pollform').onsubmit=async ev=>{
  ev.preventDefault();
  const form=ev.currentTarget, send=form.querySelector('button'), data=new FormData(form);
  const options=el('choices').value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
  options.forEach(s=>data.append('option',s));
  data.set('nonce',pollNonce); send.disabled=true;
  try {
    await call({method:'POST',body:data},'/api/polls');
    form.reset();pollNonce=crypto.randomUUID();
    el('pollmsg').textContent='Опитування опубліковано';
    await loadList('polls');
  } catch(e){el('pollmsg').textContent=e.message;}
  finally{send.disabled=false;}
};

</script>
</html>
