<section id="editor-workspace" aria-labelledby="heading" hidden>
 <p id="editor-access" class="notice" role="status">Перевіряємо доступ…</p>
 <div class="editor-tabs" role="group" aria-label="Розділи редакції" hidden>
  <button type="button" data-view="postview" aria-pressed="true" disabled><span data-icon="editor"></span>Публікації</button>
  <button type="button" data-view="pollview" aria-pressed="false" disabled><span data-icon="polls"></span>Опитування</button>
  <button type="button" data-view="caseview" aria-pressed="false" disabled><span data-icon="feedback"></span>Звернення</button>
  <button type="button" data-view="statsview" aria-pressed="false" disabled><span data-icon="users"></span>Статистика</button>
 </div>
 <div class="editor-content" hidden>
  <section id="postview">
   <h2 id="title">Нова публікація</h2>
   <fieldset id="composer" disabled>
    <div class="row">
     <label for="body">Текст новини</label>
     <small id="count">0 / 4000</small>
    </div>
    <textarea id="body" placeholder="Що відбувається у школі?"></textarea>
    <div class="row photo">
     <label class="attach">
      <span id="fileLabel">Додати фото</span>
      <input id="file" type="file" accept="image/jpeg,image/png,image/webp" aria-label="Обрати фото">
     </label>
     <button id="remove" type="button" hidden>Прибрати</button>
    </div>
    <figure id="thumbWrap" hidden></figure>
    <small>JPG, PNG або WebP · до 8 МБ</small>
    <button class="primary" id="review" disabled>Переглянути допис</button>
   </fieldset>
   <section id="confirmation" hidden>
    <article id="preview">
     <strong>86 News</strong>
     <figure id="previewWrap" hidden></figure>
     <p id="previewText" class="copy"></p>
    </article>
    <div class="actions">
     <button id="edit">До редагування</button>
     <button id="publish" class="primary">Опублікувати для підписників</button>
    </div>
   </section>
   <p id="status" class="notice" role="status"></p>
   <button id="next" hidden>Створити ще одну новину</button>
  </section>
  <section id="pollview" hidden>
   <h2>Опитування</h2>
   <div class="pollgrid">
    <form id="pollform">
     <label>Запитання<input name="question" maxlength="300" required placeholder="Що запитаємо в учнів?"></label>
     <label>Варіанти відповіді<textarea id="choices" required placeholder="Кожен варіант з нового рядка"></textarea></label>
     <small>Від 2 до 10 варіантів</small>
     <button class="primary">Опублікувати опитування</button>
     <p id="pollmsg" role="status" class="notice"></p>
    </form>
    <div class="results">
     <div class="sectionbar">
      <h3>Результати</h3>
      <button data-refresh="polls">Оновити</button>
     </div>
     <div id="pollsList"></div>
     <p id="pollsError" class="notice" role="status"></p>
     <button id="pollsMore" hidden>Показати ще</button>
    </div>
   </div>
  </section>
  <section id="caseview" hidden>
   <div class="sectionbar">
    <h2>Звернення</h2>
    <button data-refresh="cases">Оновити список</button>
   </div>
   <div id="casesList"></div>
   <p id="casesError" class="notice" role="status"></p>
   <button id="casesMore" hidden>Показати ще</button>
  </section>
  <section id="statsview" hidden>
   <h2>Статистика аудиторії</h2>
   <dl id="audience-stats" class="metrics"></dl>
   <p id="stats-message" role="status"></p>
  </section>
 </div>
</section>
